name: Build and Test

on:
    push:
        branches:
            - main
            - master
    pull_request:
        branches:
            - main
            - master
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '24'

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 11

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Check source and unit tests
              run: |
                  pnpm run lint
                  pnpm run typecheck
                  pnpm run format:check
                  pnpm test

            - name: Install integration test tools
              run: sudo apt-get update && sudo apt-get install -y tmux vim htop

            - name: Test real tmux restoration
              env:
                  TMUX_TEST_BINARY: tmux
                  HTOP_TEST_BINARY: htop
              run: pnpm run test:integration

            - name: Check snapshot performance budgets
              env:
                  TMUX_BENCH_OUTPUT: ${{ runner.temp }}/snapshot-benchmark.jsonl
              run: pnpm run test:performance

            - name: Save benchmark measurements
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: snapshot-benchmark
                  path: ${{ runner.temp }}/snapshot-benchmark.jsonl
                  if-no-files-found: ignore

            - name: Build
              run: pnpm run build
